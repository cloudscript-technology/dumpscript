# Gate de PR: lint dos scripts, build da imagem (sem push) e scan de vulnerabilidades por variante.
name: pr

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "examples/**"
      - "README.md"
      - "LICENSE"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          # SC2086 (word splitting) é intencional em DUMP_OPTIONS/flags do rclone; SC1091 = source dinâmico
          shellcheck -S warning -e SC2086,SC2155,SC1091 docker/scripts/*.sh

  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: alpine-3-21
            alpine: "3.21"
          - variant: alpine-3-20
            alpine: "3.20"
          - variant: alpine-edge
            alpine: "edge@sha256:9a341ff2287c54b86425cbee0141114d811ae69d88a36019087be6d896cef241"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Mesmo Dockerfile/args do build de produção, só amd64 e sem push (carregado no daemon para o scan)
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile.dump
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            ALPINE_VERSION=${{ matrix.alpine }}
          tags: dumpscript:pr-${{ matrix.variant }}
          cache-from: type=gha

      # Mesma imagem/flags do scan de produção (aquasec/trivy:0.58.1). Bloqueante em HIGH/CRITICAL com fix.
      - name: Scan image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivycache:/root/.cache/trivy" \
            aquasec/trivy:0.58.1 image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 1 --no-progress --format table "dumpscript:pr-${{ matrix.variant }}"
